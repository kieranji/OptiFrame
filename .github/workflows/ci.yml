name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;37.0.0 platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM tests
        run: ./gradlew :protocol-core:test :optional-openrq:test --console=plain

      - name: App unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            protocol-core/build/reports/tests
            optional-openrq/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
